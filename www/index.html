<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self' data: gap: https://ssl.gstatic.com
                   https://openui5.hana.ondemand.com
                   'unsafe-eval' 'unsafe-inline';
                   style-src 'self' 'unsafe-inline';
                   media-src *;
                   img-src 'self' data: content:;">

    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="width=device-width,
                                   initial-scale=1.0,
                                   user-scalable=no,
                                   viewport-fit=cover" />

    <title>Scandit UI5 Scanner</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        /*
         * Scandit camera viewfinder anchor — rendered behind everything.
         * The UI5 shell floats on top; when scanning is active the
         * Page background is made transparent to reveal the camera feed.
         */
        #data-capture-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }

        /* UI5 root sits above the camera layer */
        #content {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>

    <!--
        SAP OpenUI5 bootstrap via CDN.
        resourceroots maps the component namespace to the www root.
        ComponentSupport handles the declarative component container below.
    -->
    <script id="sap-ui-bootstrap"
        src="https://openui5.hana.ondemand.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m,sap.ui.core"
        data-sap-ui-resourceroots='{"com.example.scanditscanner": "./"}'
        data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compatversion="edge"
        data-sap-ui-async="true">
    </script>
</head>
<body class="sapUiBody">

    <!--
        Scandit DataCaptureView anchor.
        Must exist in the DOM before deviceready fires so Scandit
        can connectToElement() on it. Positioned behind UI5 via z-index.
    -->
    <div id="data-capture-view"></div>

    <!--
        UI5 Component container — declarative API via ComponentSupport.
    -->
    <div id="content"
         data-sap-ui-component
         data-name="com.example.scanditscanner"
         data-id="container"
         data-settings='{"id": "container"}'
         data-handle-validation="true"
         style="height: 100%;">
    </div>

    <!-- Cordova bridge — auto-generated by `cordova prepare`, do not create manually -->
    <script type="text/javascript" src="cordova.js"></script>

</body>
</html>
